# SorobanPay — Docker Compose (full local stack)
#
# Usage:
#   cp .env.example .env          # first time — fill in CONTRACT_ID
#   docker compose up             # start the full stack
#   docker compose up --profile tools   # also starts Adminer + Redis Commander
#
# Services:
#   postgres  → localhost:5432
#   redis     → localhost:6379
#   api       → http://localhost:4000
#   frontend  → http://localhost:3000
#
# Tools profile (--profile tools):
#   adminer          → http://localhost:8080  (DB browser)
#   redis-commander  → http://localhost:8081  (Redis browser)

version: "3.9"

networks:
  sorobanpay:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [sorobanpay]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sorobanpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-sorobanpay}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sorobanpay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [sorobanpay]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sorobanpay]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sorobanpay:devpassword@postgres:5432/sorobanpay}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RPC_URL: ${RPC_URL:-https://soroban-testnet.stellar.org}
      NETWORK_PASSPHRASE: ${NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      CONTRACT_ID: ${CONTRACT_ID:-}
      PORT: ${PORT:-4000}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-in-dev-only}
      NODE_ENV: production
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONTRACT_ID: ${NEXT_PUBLIC_CONTRACT_ID:-}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://soroban-testnet.stellar.org}
        NEXT_PUBLIC_NETWORK_PASSPHRASE: ${NEXT_PUBLIC_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
    restart: unless-stopped
    networks: [sorobanpay]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Tools (optional — start with: docker compose --profile tools up) ─────────

  adminer:
    image: adminer:latest
    restart: unless-stopped
    profiles: [tools]
    networks: [sorobanpay]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    profiles: [tools]
    networks: [sorobanpay]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
